[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "microduck-dance"
version = "0.1.0"
description = "Music driven dance for the Microduck robot in MuJoCo, built on microduck-playground"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Same interpreter range as microduck-playground (bam pins requires-python <3.13).
requires-python = ">=3.12, <3.13"
dependencies = [
    # The upstream project, from the git submodule (see [tool.uv.sources]).
    "mjlab-microduck",
    # Direct dependency only so the aarch64 torch source below applies (uv applies
    # [tool.uv.sources] to direct dependencies only). Same pin as upstream.
    "torch==2.9.1",
]

[dependency-groups]
dev = ["pytest>=8"]

# mjlab imports every package listed here when it is imported, so `uv run train`,
# `uv run play` and `uv run list-envs` see the dance tasks next to the upstream ones.
[project.entry-points."mjlab.tasks"]
microduck_dance = "microduck_dance.tasks"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
indent-width = 4

# uv reads overrides and the torch index from the root project only, so the
# entries below repeat the ones in third_party/microduck-playground/pyproject.toml.
# tests/test_project_setup.py checks that they stay equal. The bam git source is
# taken from the submodule's own [tool.uv.sources], so it is not repeated here.
[tool.uv]
override-dependencies = [
    "protobuf>=4.0,<7.0",
    "onnx>=1.20.1",
    "zmq ; python_version < '3.0'",
]

[tool.uv.sources]
mjlab-microduck = { path = "third_party/microduck-playground", editable = true }
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
